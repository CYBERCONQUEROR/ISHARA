version: '3.8'

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - ishara-network
    volumes:
      - ./public:/app/public
    restart: unless-stopped

  # Backend Python FastAPI Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/backend
    volumes:
      - ./backend:/app/backend
      - model-data:/app/models
    networks:
      - ishara-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - ishara-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  model-data:
    driver: local

networks:
  ishara-network:
    driver: bridge 