<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition Direct Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Speech Recognition Direct Test</h1>
    
    <div id="status"></div>
    
    <button onclick="testSpeechRecognition()">Test Speech Recognition</button>
    <button onclick="startListening()">Start Listening</button>
    <button onclick="stopListening()">Stop Listening</button>
    
    <div id="results">
        <h3>Results:</h3>
        <div id="transcript"></div>
    </div>

    <script>
        let recognition = null;
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
            console.log(message);
        }
        
        function testSpeechRecognition() {
            log('=== Testing Speech Recognition Support ===', 'info');
            
            // Check protocol
            log(`Protocol: ${window.location.protocol}`, 'info');
            log(`URL: ${window.location.href}`, 'info');
            
            // Check user agent
            log(`User Agent: ${navigator.userAgent}`, 'info');
            
            // Check for speech recognition APIs
            const apis = [
                'SpeechRecognition',
                'webkitSpeechRecognition',
                'mozSpeechRecognition',
                'msSpeechRecognition'
            ];
            
            let foundAPI = null;
            
            apis.forEach(api => {
                const supported = api in window;
                log(`${api}: ${supported ? '✅ Supported' : '❌ Not Supported'}`, supported ? 'success' : 'error');
                
                if (supported && !foundAPI) {
                    foundAPI = window[api];
                    log(`Using ${api}`, 'success');
                }
            });
            
            if (foundAPI) {
                try {
                    recognition = new foundAPI();
                    log('✅ Speech recognition instance created successfully', 'success');
                    
                    // Configure recognition
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.lang = 'en-US';
                    recognition.maxAlternatives = 1;
                    
                    // Set up event handlers
                    recognition.onstart = () => log('✅ Recognition started', 'success');
                    recognition.onend = () => log('Recognition ended', 'info');
                    recognition.onerror = (event) => log(`❌ Recognition error: ${event.error} - ${event.message}`, 'error');
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        log(`✅ Recognized: "${transcript}"`, 'success');
                        transcriptDiv.textContent = transcript;
                    };
                    
                } catch (error) {
                    log(`❌ Error creating recognition instance: ${error.message}`, 'error');
                }
            } else {
                log('❌ No speech recognition API found', 'error');
            }
        }
        
        function startListening() {
            if (recognition) {
                log('Starting recognition...', 'info');
                try {
                    recognition.start();
                } catch (error) {
                    log(`❌ Error starting recognition: ${error.message}`, 'error');
                }
            } else {
                log('❌ Recognition not initialized. Run test first.', 'error');
            }
        }
        
        function stopListening() {
            if (recognition) {
                log('Stopping recognition...', 'info');
                try {
                    recognition.stop();
                } catch (error) {
                    log(`❌ Error stopping recognition: ${error.message}`, 'error');
                }
            } else {
                log('❌ Recognition not initialized.', 'error');
            }
        }
        
        // Auto-test on page load
        window.addEventListener('load', () => {
            log('Page loaded. Running initial test...', 'info');
            setTimeout(testSpeechRecognition, 1000);
        });
    </script>
</body>
</html>
